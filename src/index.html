<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Card Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>SD Card Finder</h1>
        <p>Choose a device and card to check compatibility.</p>

        <section>
            <label for="device-select">Device</label>
            <select id="device-select"></select>
        </section>

        <section>
            <label for="profile-select">Use case</label>
            <select id="profile-select"></select>
        </section>

        <section>
            <label for="card-select">SD card</label>
            <select id="card-select"></select>
        </section>

        <button id="check-button">Check compatibility</button>

        <section id="result"></section>
    </main>

    <script src="js/compatibility.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
